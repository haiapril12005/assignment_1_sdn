<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleQuiz - API Dashboard & Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --border-color: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-rgb: 56, 189, 248;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .badge-icon {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-weight: 800;
      font-size: 1.1rem;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--success);
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      flex: 1;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .card-header h2 {
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #334155;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    .btn-sm {
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input, textarea, select {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .list-item {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s;
    }

    .list-item:hover {
      border-color: #475569;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .item-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .item-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .pill-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: #334155;
      color: #94a3b8;
    }

    .code-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #38bdf8;
      overflow-x: auto;
      max-height: 250px;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="badge-icon">Q</div>
      <div>
        <h1>SimpleQuiz API</h1>
        <span>SDN302 Assignment 1</span>
      </div>
    </div>
    <div class="status-indicator" id="serverStatus">
      <div class="dot"></div>
      <span id="statusText">Checking Server...</span>
    </div>
  </header>

  <main class="container">
    <!-- Left Column: Quizzes Management -->
    <section class="card">
      <div class="card-header">
        <h2>📚 Quizzes Management</h2>
        <button class="btn btn-sm" onclick="loadQuizzes()">🔄 Refresh Quizzes</button>
      </div>

      <!-- Create Quiz Form -->
      <form id="createQuizForm" onsubmit="handleCreateQuiz(event)">
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <div class="form-group">
            <label>Quiz Title *</label>
            <input type="text" id="quizTitle" placeholder="e.g. Science & Geography Quiz" required />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="quizDesc" placeholder="e.g. Test your general knowledge on capitals and facts"></textarea>
          </div>
          <button type="submit" class="btn">➕ Create Quiz (POST /quizzes)</button>
        </div>
      </form>

      <div class="card-header" style="margin-top: 1rem;">
        <h3>Quizzes List (GET /quizzes - Populated)</h3>
        <span class="pill-badge" id="quizCount">0 quizzes</span>
      </div>

      <div class="item-list" id="quizzesContainer">
        <p style="color: var(--text-muted); font-size: 0.85rem;">Loading quizzes...</p>
      </div>
    </section>

    <!-- Right Column: Questions & Tests -->
    <section class="card">
      <div class="card-header">
        <h2>❓ Questions Management</h2>
        <button class="btn btn-sm" onclick="loadQuestions()">🔄 Refresh Questions</button>
      </div>

      <!-- Create Question Form -->
      <form id="createQuestionForm" onsubmit="handleCreateQuestion(event)">
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <div class="form-group">
            <label>Question Text *</label>
            <input type="text" id="qText" placeholder="e.g. What is the capital of Vietnam?" required />
          </div>
          <div class="form-group">
            <label>Options (comma separated, min 2) *</label>
            <input type="text" id="qOptions" placeholder="Hanoi, Ho Chi Minh City, Da Nang, Hue" required />
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
            <div class="form-group">
              <label>Correct Answer Index (0-based) *</label>
              <input type="number" id="qIndex" min="0" value="0" required />
            </div>
            <div class="form-group">
              <label>Keywords (comma separated)</label>
              <input type="text" id="qKeywords" placeholder="capital, vietnam" />
            </div>
          </div>
          <button type="submit" class="btn">➕ Create Question (POST /questions)</button>
        </div>
      </form>

      <div class="card-header" style="margin-top: 1rem;">
        <h3>Questions List (GET /questions)</h3>
        <span class="pill-badge" id="questionCount">0 questions</span>
      </div>

      <div class="item-list" id="questionsContainer">
        <p style="color: var(--text-muted); font-size: 0.85rem;">Loading questions...</p>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = '';

    // Check status
    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('statusText').textContent = `Connected: ${data.database.name} (${data.database.status})`;
      } catch (err) {
        document.getElementById('statusText').textContent = 'Server Disconnected';
        document.getElementById('serverStatus').style.color = '#ef4444';
      }
    }

    // Load Quizzes
    async function loadQuizzes() {
      const container = document.getElementById('quizzesContainer');
      try {
        const res = await fetch('/quizzes');
        const quizzes = await res.json();
        document.getElementById('quizCount').textContent = `${quizzes.length} quizzes`;

        if (quizzes.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">No quizzes created yet.</p>';
          return;
        }

        container.innerHTML = quizzes.map(q => `
          <div class="list-item">
            <div class="item-header">
              <div>
                <div class="item-title">${q.title}</div>
                <div class="item-meta">ID: ${q._id}</div>
              </div>
              <button class="btn btn-danger btn-sm" onclick="deleteQuiz('${q._id}')">🗑️ Delete</button>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted);">${q.description || 'No description'}</p>
            <div>
              <span class="pill-badge" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8;">
                ${q.questions ? q.questions.length : 0} Questions
              </span>
            </div>
            <div class="actions">
              <button class="btn btn-secondary btn-sm" onclick="filterCapitalQuestions('${q._id}')">
                🔍 Filter "capital" (/populate)
              </button>
              <button class="btn btn-secondary btn-sm" onclick="promptAddQuestion('${q._id}')">
                ➕ Add Question
              </button>
            </div>
            ${q.questions && q.questions.length > 0 ? `
              <div class="code-box">
                ${q.questions.map((ques, idx) => `
                  <div><strong>${idx + 1}. ${ques.text || ques}</strong></div>
                  ${ques.options ? `<div style="color: #94a3b8; font-size: 0.75rem; margin-bottom: 4px;">Choices: ${ques.options.join(', ')} | Ans: index ${ques.correctAnswerIndex}</div>` : ''}
                `).join('')}
              </div>
            ` : ''}
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444;">Error loading quizzes: ${err.message}</p>`;
      }
    }

    // Load Questions
    async function loadQuestions() {
      const container = document.getElementById('questionsContainer');
      try {
        const res = await fetch('/questions');
        const questions = await res.json();
        document.getElementById('questionCount').textContent = `${questions.length} questions`;

        if (questions.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">No questions created yet.</p>';
          return;
        }

        container.innerHTML = questions.map(q => `
          <div class="list-item">
            <div class="item-header">
              <div>
                <div class="item-title">${q.text}</div>
                <div class="item-meta">ID: ${q._id}</div>
              </div>
              <button class="btn btn-danger btn-sm" onclick="deleteQuestion('${q._id}')">🗑️ Delete</button>
            </div>
            <div style="font-size: 0.8rem; color: #94a3b8;">
              Options: ${q.options ? q.options.join(', ') : 'N/A'}
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <span class="pill-badge" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">
                Correct Index: ${q.correctAnswerIndex} (${q.options ? q.options[q.correctAnswerIndex] : ''})
              </span>
              ${q.keywords && q.keywords.length ? `<span class="pill-badge">Keywords: ${q.keywords.join(', ')}</span>` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444;">Error loading questions: ${err.message}</p>`;
      }
    }

    // Create Quiz
    async function handleCreateQuiz(e) {
      e.preventDefault();
      const title = document.getElementById('quizTitle').value.trim();
      const description = document.getElementById('quizDesc').value.trim();

      const res = await fetch('/quizzes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description })
      });
      const text = await res.text();
      alert(text);
      document.getElementById('createQuizForm').reset();
      loadQuizzes();
    }

    // Create Question
    async function handleCreateQuestion(e) {
      e.preventDefault();
      const text = document.getElementById('qText').value.trim();
      const options = document.getElementById('qOptions').value.split(',').map(s => s.trim()).filter(Boolean);
      const correctAnswerIndex = parseInt(document.getElementById('qIndex').value, 10);
      const keywords = document.getElementById('qKeywords').value.split(',').map(s => s.trim()).filter(Boolean);

      const res = await fetch('/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, options, correctAnswerIndex, keywords })
      });
      const data = await res.json();
      if (res.ok) {
        alert(`Question created with ID: ${data._id}`);
        document.getElementById('createQuestionForm').reset();
        loadQuestions();
      } else {
        alert(`Error: ${data.message || JSON.stringify(data)}`);
      }
    }

    // Delete Quiz
    async function deleteQuiz(id) {
      if (!confirm('Are you sure you want to delete this quiz?')) return;
      await fetch(`/quizzes/${id}`, { method: 'DELETE' });
      loadQuizzes();
    }

    // Delete Question
    async function deleteQuestion(id) {
      if (!confirm('Are you sure you want to delete this question?')) return;
      await fetch(`/questions/${id}`, { method: 'DELETE' });
      loadQuestions();
      loadQuizzes();
    }

    // Filter Capital Questions (Requirement 3)
    async function filterCapitalQuestions(quizId) {
      const res = await fetch(`/quizzes/${quizId}/populate`);
      const quiz = await res.json();
      alert(`Quiz "${quiz.title}" has ${quiz.questions.length} questions matching "capital":\n` +
        quiz.questions.map((q, i) => `${i + 1}. ${q.text}`).join('\n')
      );
    }

    // Prompt Add Question to Quiz (Requirement 4)
    async function promptAddQuestion(quizId) {
      const text = prompt('Enter question text:', 'What is the capital of Italy?');
      if (!text) return;
      const opts = prompt('Enter options (comma separated):', 'Rome, Milan, Venice, Naples');
      if (!opts) return;
      const idx = prompt('Enter correct answer index (0-based):', '0');

      const res = await fetch(`/quizzes/${quizId}/question`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text,
          options: opts.split(',').map(s => s.trim()),
          correctAnswerIndex: parseInt(idx, 10),
          keywords: ['capital', 'italy']
        })
      });
      if (res.ok) {
        alert('Question added to quiz successfully!');
        loadQuizzes();
      } else {
        alert('Failed to add question');
      }
    }

    checkStatus();
    loadQuizzes();
    loadQuestions();
  </script>
</body>
</html>
